[workspace]
resolver="2"
members=["crates/kitt-domain","crates/kitt-application","crates/kitt-infrastructure","apps/kittd","apps/kittctl"]
exclude=["apps/kitt-hud/src-tauri"]

[workspace.package]
version="0.1.0"
edition="2024"
rust-version="1.85"
license="MIT"

[workspace.dependencies]
serde={version="1",features=["derive"]}
serde_json="1"
thiserror="2"
uuid={version="1",features=["v4"]}
reqwest={version="0.12",default-features=false,features=["blocking","json","rustls-tls"]}
dirs="6"
base64="0.22"
url="2"
