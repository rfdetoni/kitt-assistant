name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: assistant-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install Linux audio build dependencies
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev pkg-config
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Verify voice-disabled feature set
        run: cargo check --workspace --no-default-features --locked
      - name: Run Rust contract and daemon integration tests
        run: cargo test --workspace --locked

  python-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout Assistant
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: kitt-assistant
          persist-credentials: false
      - name: Checkout compatible Agent control plane
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: rfdetoni/kitt-agent-cli
          ref: 038e4e8f48e2e30827c50a81a88e9bc610307d3d
          path: kitt-agent-cli
          persist-credentials: false
      - name: Checkout protocol dependency
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: rfdetoni/kitt-protocol
          ref: ed096ba68368c8b449c1baf715e0000871ec9fb9
          path: kitt-protocol
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.14'
      - name: Install split Python packages
        run: |
          python -m pip install -U pip pytest pytest-asyncio
          python -m pip install --no-deps ./kitt-protocol/sdk/python
          python -m pip install ./kitt-agent-cli
          python -m pip install --no-deps --force-reinstall ./kitt-protocol/sdk/python
          python -m pip install --no-deps ./kitt-assistant/packages/kitt-assistant-runtime
          python -m pip check
      - name: Compile runtime
        run: python -m compileall -q kitt-assistant/packages/kitt-assistant-runtime/kitt
      - name: Prove runtime ownership
        run: |
          python - <<'PY'
          from pathlib import Path
          import kitt.daemon.client, kitt.daemon.server, kitt.remote.server
          for module in (kitt.daemon.client, kitt.daemon.server, kitt.remote.server):
              assert 'site-packages' in str(Path(module.__file__).resolve()), module.__file__
          print('Assistant runtime ownership: ok')
          PY
      - name: Run critical Assistant runtime suite
        run: python -m pytest -q -o faulthandler_timeout=30 kitt-assistant/packages/kitt-assistant-runtime/tests

  lifecycle-portability:
    name: lifecycle (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout Assistant
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: kitt-assistant
          persist-credentials: false
      - name: Checkout compatible Agent control plane
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: rfdetoni/kitt-agent-cli
          ref: 038e4e8f48e2e30827c50a81a88e9bc610307d3d
          path: kitt-agent-cli
          persist-credentials: false
      - name: Checkout protocol dependency
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: rfdetoni/kitt-protocol
          ref: ed096ba68368c8b449c1baf715e0000871ec9fb9
          path: kitt-protocol
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.14'
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
      - name: Validate native service manager for host OS
        working-directory: kitt-assistant
        run: cargo check -p kittctl --locked
      - name: Install split Python packages
        run: |
          python -m pip install -U pip pytest pytest-asyncio
          python -m pip install --no-deps ./kitt-protocol/sdk/python
          python -m pip install ./kitt-agent-cli
          python -m pip install --no-deps --force-reinstall ./kitt-protocol/sdk/python
          python -m pip install --no-deps ./kitt-assistant/packages/kitt-assistant-runtime
          python -m pip check
      - name: Validate daemon start/stop, launcher, paths and cleanup
        run: python -m pytest -q kitt-assistant/packages/kitt-assistant-runtime/tests/test_daemon_process.py kitt-assistant/packages/kitt-assistant-runtime/tests/prime_architecture/test_daemon_runtime.py::TestDaemonRuntime::test_00_readiness_waits_for_required_runtime_start kitt-assistant/packages/kitt-assistant-runtime/tests/prime_architecture/test_daemon_runtime.py::TestDaemonRuntime::test_00a_stop_closes_an_idle_connected_client_and_releases_instance

  hud-web:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout assistant
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: kitt-assistant
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: kitt-assistant/apps/kitt-hud/package-lock.json
      - name: Install HUD dependencies
        working-directory: kitt-assistant/apps/kitt-hud
        run: npm ci
      - name: Test Control Center async discovery
        working-directory: kitt-assistant
        run: node --test tests/control_center_r3.test.mjs
      - name: Build HUD
        working-directory: kitt-assistant/apps/kitt-hud
        run: npm run build
