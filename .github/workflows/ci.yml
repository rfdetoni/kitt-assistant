name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: assistant-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install Linux audio build dependencies
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev pkg-config
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --all --check
      - name: Locked build
        run: cargo build --workspace --locked
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Tests
        run: cargo test --workspace --locked

  python-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Assistant
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: kitt-assistant
          persist-credentials: false
      - name: Checkout current Agent control plane
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: rfdetoni/kitt-agent-cli
          ref: main
          path: kitt-agent-cli
          persist-credentials: false
      - name: Checkout protocol dependency
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: rfdetoni/kitt-protocol
          ref: 97e1cad8dfc6d3a74fe2332530dc01a25e476516
          path: kitt-protocol
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Install split Python packages
        run: |
          python -m pip install -U pip pytest pytest-asyncio
          python -m pip install --no-deps ./kitt-protocol/sdk/python
          python -m pip install ./kitt-agent-cli
          python -m pip install --no-deps --force-reinstall ./kitt-protocol/sdk/python
          python -m pip install --no-deps ./kitt-assistant/packages/kitt-assistant-runtime
          python -m pip check
      - name: Compile runtime
        run: python -m compileall -q kitt-assistant/packages/kitt-assistant-runtime/kitt
      - name: Prove runtime ownership
        run: |
          python - <<'PY'
          from pathlib import Path
          import kitt
          import kitt.daemon.client
          import kitt.daemon.server
          import kitt.remote.server
          assert kitt.__version__.startswith("0.41."), kitt.__version__
          import inspect
          from pathlib import Path as _Path
          from kitt.core.completion_guard import install_completion_guard
          class _Processor:
              def _execute_tool_loop(self, cmd, request, exe_profile, exe_client, workspace_id, security_context, agent_route=None):
                  if False:
                      yield None
          class _Registry:
              root_path = _Path('.')
          _processor = _Processor()
          install_completion_guard(_processor, _Registry())
          assert 'agent_route' in inspect.signature(_processor._execute_tool_loop).parameters
          for module in (kitt.daemon.client, kitt.daemon.server, kitt.remote.server):
              path = Path(module.__file__).resolve()
              assert 'site-packages' in str(path), path
          print('agent root + assistant runtime wheel composition: ok')
          PY
      - name: Run Assistant runtime suite
        run: python -m unittest discover -s kitt-assistant/packages/kitt-assistant-runtime/tests -v

  hud-web:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout assistant
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: kitt-assistant
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: kitt-assistant/apps/kitt-hud/package-lock.json
      - name: Install HUD dependencies
        working-directory: kitt-assistant/apps/kitt-hud
        run: npm ci
      - name: Test Control Center async discovery
        working-directory: kitt-assistant
        run: node --test tests/control_center_r3.test.mjs
      - name: Build HUD
        working-directory: kitt-assistant/apps/kitt-hud
        run: npm run build
