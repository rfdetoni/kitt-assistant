name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: assistant-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install Linux audio build dependencies
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev pkg-config
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Tests
        run: cargo test --workspace

  python-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Assistant
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: kitt-assistant
          persist-credentials: false
      - name: Checkout current Agent control plane
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: rfdetoni/kitt-agent-cli
          ref: main
          path: kitt-agent-cli
          persist-credentials: false
      - name: Checkout protocol dependency
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: rfdetoni/kitt-protocol
          ref: 90882e9a44001e96fa84bc30e235d86687e08825
          path: kitt-protocol
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Install split Python packages
        run: |
          python -m pip install -U pip pytest pytest-asyncio prompt-toolkit
          python -m pip install --no-deps -e ./kitt-protocol/sdk/python
          python -m pip install --no-deps -e ./kitt-agent-cli
          python -m pip install --no-deps -e ./kitt-assistant/packages/kitt-assistant-runtime
      - name: Compile runtime
        run: python -m compileall -q kitt-assistant/packages/kitt-assistant-runtime/kitt
      - name: Prove runtime ownership
        run: |
          python - <<'PY'
          from pathlib import Path
          import kitt.daemon.client
          import kitt.daemon.server
          import kitt.remote.server
          for module in (kitt.daemon.client, kitt.daemon.server, kitt.remote.server):
              path = Path(module.__file__).resolve()
              assert 'kitt-assistant-runtime' in str(path), path
          print('assistant runtime namespace ownership: ok')
          PY
      - name: Run Assistant runtime suite
        run: python -m unittest discover -s kitt-assistant/packages/kitt-assistant-runtime/tests -v

  hud-web:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout assistant
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: kitt-assistant
          persist-credentials: false
      - name: Checkout protocol sibling required by HUD file dependency
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: rfdetoni/kitt-protocol
          ref: 90882e9a44001e96fa84bc30e235d86687e08825
          path: kitt-protocol
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: kitt-assistant/apps/kitt-hud/package-lock.json
      - name: Install HUD dependencies
        working-directory: kitt-assistant/apps/kitt-hud
        run: npm ci
      - name: Test Control Center async discovery
        working-directory: kitt-assistant
        run: node --test tests/control_center_r3.test.mjs
      - name: Build HUD
        working-directory: kitt-assistant/apps/kitt-hud
        run: npm run build
