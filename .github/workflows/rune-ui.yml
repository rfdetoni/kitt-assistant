name: Rune UI
on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/kitt-rune/**'
      - '.github/workflows/rune-ui.yml'
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: rune-ui-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bridge-security:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: { persist-credentials: false }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: { node-version: '22' }
      - run: node --check apps/kitt-rune/web/bridge.js && node --check apps/kitt-rune/web/serve.mjs
      - run: node --test apps/kitt-rune/web/serve.test.mjs

  native-and-web-check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: { persist-credentials: false }
      - run: sudo apt-get update && sudo apt-get install -y pkg-config libxkbcommon-dev libwayland-dev libasound2-dev
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with: { targets: wasm32-unknown-unknown }
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          cache-bin: 'false'
          workspaces: apps/kitt-rune -> target
      - name: Verify native Rune presentation and headless navigation tests
        run: cargo test --manifest-path apps/kitt-rune/Cargo.toml --lib
      - name: Verify WebGPU wasm target
        run: cargo check --manifest-path apps/kitt-rune/Cargo.toml --lib --target wasm32-unknown-unknown
