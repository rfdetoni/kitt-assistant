name: migrate-agent-runtime

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/migrate-agent-runtime.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout assistant
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'

      - name: Extract pinned Agent runtime
        shell: bash
        env:
          SOURCE_SHA: 710597fc15677e3d88097623f1113120577b0ee2
        run: |
          set -euo pipefail
          SRC="$RUNNER_TEMP/kitt-agent-cli"
          DEST="packages/kitt-assistant-runtime"
          git clone --filter=blob:none https://github.com/rfdetoni/kitt-agent-cli.git "$SRC"
          git -C "$SRC" checkout --detach "$SOURCE_SHA"
          test "$(git -C "$SRC" rev-parse HEAD)" = "$SOURCE_SHA"

          rm -rf "$DEST"
          mkdir -p "$DEST/kitt" "$DEST/tests/remote" "$DEST/tests/prime_architecture"
          cp -a "$SRC/kitt/daemon" "$DEST/kitt/daemon"
          cp -a "$SRC/kitt/remote" "$DEST/kitt/remote"
          cp -a "$SRC/tests/remote/." "$DEST/tests/remote/"
          cp "$SRC/tests/prime_architecture/test_daemon_ipc_boundary_189b794.py" "$DEST/tests/prime_architecture/"
          cp "$SRC/tests/prime_architecture/test_daemon_runtime.py" "$DEST/tests/prime_architecture/"
          cp "$SRC/tests/prime_architecture/test_tui_daemon_integration.py" "$DEST/tests/prime_architecture/"
          cp "$SRC/tests/test_remote_cli_precedence.py" "$DEST/tests/"
          cp "$SRC/tests/test_tui_remote_commands.py" "$DEST/tests/"

          cat > "$DEST/pyproject.toml" <<'EOF'
          [build-system]
          requires = ["setuptools>=61.0"]
          build-backend = "setuptools.build_meta"

          [project]
          name = "kitt-assistant-runtime"
          version = "0.1.0"
          description = "K.I.T.T. Python assistant daemon and remote runtime"
          requires-python = ">=3.12"
          license = {text = "MIT"}
          dependencies = ["kitt-agent-cli>=0.3.0,<0.4"]

          [tool.setuptools.packages.find]
          include = ["kitt.daemon*", "kitt.remote*"]
          namespaces = true

          [tool.setuptools.package-data]
          "kitt.remote" = ["static/*.html", "static/*.css", "static/*.js"]

          [tool.pytest.ini_options]
          testpaths = ["tests"]
          EOF

          cat > "$DEST/README.md" <<EOF
          # K.I.T.T. Assistant Runtime

          Python runtime companion for K.I.T.T. Assistant. It owns the local Agent daemon transport/server and remote web runtime while the coding control plane remains in \`kitt-agent-cli\`.

          Source extraction baseline: \`rfdetoni/kitt-agent-cli@$SOURCE_SHA\`.

          The package intentionally shares the \`kitt\` namespace with the Agent control plane. It depends on \`kitt-agent-cli\` for orchestration/domain services and contains no duplicate Agent core implementation.
          EOF

          printf '%s\n' "$SOURCE_SHA" > "$DEST/SOURCE_COMMIT"

          # Prove the extracted package, not the source checkout, supplies daemon/remote.
          rm -rf "$SRC/kitt/daemon" "$SRC/kitt/remote"
          python -m pip install -U pip >/dev/null
          python -m pip install -e "$SRC[dev]" >/dev/null
          python -m pip install --no-deps -e "$DEST" >/dev/null
          python -m compileall -q "$DEST/kitt"
          python - <<'PY'
          import kitt.daemon.client
          import kitt.daemon.server
          import kitt.remote.server
          from pathlib import Path
          for module in (kitt.daemon.client, kitt.daemon.server, kitt.remote.server):
              path = Path(module.__file__).resolve()
              assert 'kitt-assistant-runtime' in str(path), path
          PY
          python -m unittest discover -s "$DEST/tests" -v

      - name: Commit validated runtime package
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add packages/kitt-assistant-runtime
          if git diff --cached --quiet; then
            echo 'Runtime package already matches the pinned source.'
            exit 0
          fi
          git commit -m 'refactor(runtime): own Agent daemon and remote Python runtime'
          git push origin HEAD:main
