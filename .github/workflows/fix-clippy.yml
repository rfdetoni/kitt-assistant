name: fix-clippy

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-clippy.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply targeted clippy cleanup
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('apps/kittd/src/settings_web.rs')
          text = path.read_text(encoding='utf-8')
          old = "            stderr\n                .trim()\n                .is_empty()\n                .then_some(stdout.trim())\n                .unwrap_or(stderr.trim())\n"
          new = "            if stderr.trim().is_empty() {\n                stdout.trim()\n            } else {\n                stderr.trim()\n            }\n"
          if text.count(old) != 1:
              raise SystemExit(f'expected one clippy pattern, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          cargo fmt --all
          git diff --check
          changed="$(git diff --name-only)"
          test "$changed" = "apps/kittd/src/settings_web.rs"
          git config user.name 'KITT Migration Bot'
          git config user.email '85571449+rfdetoni@users.noreply.github.com'
          git add apps/kittd/src/settings_web.rs
          git commit -m 'style(kittd): satisfy clippy 1.98'
          git push origin HEAD:main
