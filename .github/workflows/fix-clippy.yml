name: fix-clippy

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-clippy.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply targeted clippy cleanup
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('apps/kittd/src/settings_web.rs')
          text = path.read_text()
          old = '''            stderr
                .trim()
                .is_empty()
                .then_some(stdout.trim())
                .unwrap_or(stderr.trim())
'''
          new = '''            if stderr.trim().is_empty() {
                stdout.trim()
            } else {
                stderr.trim()
            }
'''
          if old not in text:
              raise SystemExit('expected clippy pattern not found')
          path.write_text(text.replace(old, new, 1))
          PY
          cargo fmt --all
          git diff --check
          changed="$(git diff --name-only)"
          test "$changed" = "apps/kittd/src/settings_web.rs"
          git config user.name 'KITT Migration Bot'
          git config user.email '85571449+rfdetoni@users.noreply.github.com'
          git add apps/kittd/src/settings_web.rs
          git commit -m 'style(kittd): satisfy clippy 1.98'
          git push origin HEAD:main
# one-shot rerun after validated source restoration
