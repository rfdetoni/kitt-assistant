name: fix-rustfmt

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-rustfmt.yml'

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply rustfmt and commit only formatter output
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          git diff --check
          if git diff --quiet -- apps/kittd/src/settings_web.rs; then
            echo 'settings_web.rs already formatted'
            exit 0
          fi
          changed="$(git diff --name-only)"
          test "$changed" = "apps/kittd/src/settings_web.rs"
          git config user.name 'KITT Migration Bot'
          git config user.email '85571449+rfdetoni@users.noreply.github.com'
          git add apps/kittd/src/settings_web.rs
          git commit -m 'style(kittd): apply rustfmt'
          git push origin HEAD:main
