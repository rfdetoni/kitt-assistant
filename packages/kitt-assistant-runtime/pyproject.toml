[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "kitt-assistant-runtime"
version = "0.1.0"
description = "K.I.T.T. Python assistant daemon and remote runtime"
requires-python = ">=3.12"
license = {text = "MIT"}
dependencies = ["kitt-agent-cli>=0.3.0,<0.4"]

[tool.setuptools.packages.find]
include = ["kitt.daemon*", "kitt.remote*"]
namespaces = true

[tool.setuptools.package-data]
"kitt.remote" = ["static/*.html", "static/*.css", "static/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
