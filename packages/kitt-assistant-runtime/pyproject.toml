[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "kitt-assistant-runtime"
version = "0.2.21"
description = "K.I.T.T. Python assistant daemon and remote runtime"
requires-python = ">=3.14"
license = {text = "MIT"}
dependencies = ["kitt-agent-cli>=0.76.0,<0.78"]

[tool.setuptools.packages.find]
include = ["kitt.daemon*", "kitt.remote*"]
namespaces = true

[tool.setuptools.package-data]
"kitt.remote" = ["static/*.html", "static/*.css", "static/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
