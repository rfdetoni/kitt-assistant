[package]
name = "kittd"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
default = ["voice"]
voice = ["dep:cpal", "dep:hound", "dep:rustpotter"]

[dependencies]
kitt-domain = { path = "../../crates/kitt-domain" }
kitt-application = { path = "../../crates/kitt-application" }
kitt-infrastructure = { path = "../../crates/kitt-infrastructure" }
kitt-protocol = { git = "https://github.com/rfdetoni/kitt-protocol", rev = "5369821eb12128a08d80a56874351aaf02ef5cc7" }
kitt-memory-core = { git = "https://github.com/rfdetoni/kitt-memory", rev = "defa05c7712c726a4accc3626757b270d190387b" }
kitt-memory-sqlite = { git = "https://github.com/rfdetoni/kitt-memory", rev = "defa05c7712c726a4accc3626757b270d190387b" }
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
dirs.workspace = true
base64.workspace = true
url.workspace = true
cpal = { workspace = true, optional = true }
hound = { workspace = true, optional = true }
rustpotter = { workspace = true, optional = true }
reqwest.workspace = true
