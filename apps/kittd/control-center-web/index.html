<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>KITT Control Center</title>
  <link rel="stylesheet" href="/app.css">
</head>
<body>
  <div class="shell">
    <aside class="sidebar">
      <div class="brand"><span class="scanner"></span><div><strong>K.I.T.T.</strong><small>CONTROL CENTER</small></div></div>
      <label class="search"><span>⌕</span><input id="search" type="search" placeholder="Buscar configuração…" autocomplete="off"></label>
      <nav id="nav" aria-label="Seções"></nav>
      <div class="sidebar-foot"><span id="daemon-dot" class="dot"></span><span id="daemon-status">kittd</span><small id="revision"></small></div>
    </aside>
    <main>
      <header class="topbar">
        <div><p class="eyebrow">LOCAL • LOOPBACK ONLY</p><h1>Configurações do ecossistema</h1></div>
        <div class="top-actions"><button id="reset-all" class="ghost">Descartar</button><button id="apply-all" class="primary" disabled>Aplicar alterações</button></div>
      </header>
      <section id="alerts" aria-live="polite"></section>
      <section id="overview" class="overview"></section>
      <section id="content" class="content"></section>
    </main>
  </div>
  <dialog id="diff-dialog"><form method="dialog"><header><div><p class="eyebrow">VALIDAÇÃO</p><h2>Revisar alterações</h2></div><button value="cancel" class="icon">×</button></header><pre id="diff"></pre><footer><button value="cancel" class="ghost">Cancelar</button><button id="confirm-apply" value="default" class="primary">Confirmar e aplicar</button></footer></form></dialog>
  <script src="/app.js" defer></script>
</body>
</html>
