<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>KITT Control Center</title>
  <link rel="stylesheet" href="/app.css">
</head>
<body>
  <a class="skip-link" href="#content">Ir para configurações</a>
  <div class="shell">
    <aside class="sidebar" id="settings-sidebar">
      <div class="brand"><span class="scanner"></span><div><strong>K.I.T.T.</strong><small>CONTROL CENTER</small></div></div>
      <label class="search"><span aria-hidden="true">⌕</span><input id="search" aria-label="Buscar configuração" type="search" placeholder="Buscar… (Ctrl+K)" autocomplete="off"></label>
      <label class="mobile-nav-control" for="mobile-nav-select">
        <span>Navegação</span>
        <select id="mobile-nav-select" aria-label="Navegação do Control Center"></select>
      </label>
      <nav id="nav" aria-label="Seções"></nav>
      <button id="reset-layout" class="ghost" title="Restaurar largura dos painéis">Restaurar layout</button>
      <div class="sidebar-foot"><span id="daemon-dot" class="dot"></span><span id="daemon-status">kittd</span><small id="revision"></small></div>
    </aside>
    <div id="sidebar-resize" class="resize-handle" role="separator" tabindex="0" aria-label="Largura da navegação" aria-orientation="vertical" aria-controls="settings-sidebar"></div>
    <main>
      <header class="topbar">
        <div><p id="top-eyebrow" class="eyebrow">LOCAL • LOOPBACK ONLY</p><h1 id="top-title">Configurações do ecossistema</h1></div>
        <div id="top-actions" class="top-actions"><button id="reset-all" class="ghost">Descartar</button><button id="apply-all" class="primary" disabled>Aplicar alterações</button></div>
      </header>
      <section id="alerts" aria-live="polite"></section>
      <section id="overview" class="overview"></section>
      <section id="content" class="content" tabindex="-1"></section>
      <footer class="workspace-status"><span>KNIGHT INDUSTRIES · CONTROL CENTER</span><span id="pending-status" role="status">Sem alterações pendentes</span></footer>
    </main>
  </div>
  <dialog id="diff-dialog" aria-labelledby="diff-title"><form method="dialog"><header><div><p class="eyebrow">VALIDAÇÃO</p><h2 id="diff-title">Revisar alterações</h2></div><button value="cancel" class="icon" aria-label="Fechar revisão">×</button></header><pre id="diff"></pre><footer><button value="cancel" class="ghost">Cancelar</button><button id="confirm-apply" value="default" class="primary">Confirmar e aplicar</button></footer></form></dialog>
  <script src="/app.js" defer></script>
</body>
</html>
