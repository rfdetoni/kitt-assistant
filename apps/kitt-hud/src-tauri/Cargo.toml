[package]
name = "kitt-hud"
version = "0.1.12"
edition = "2024"
rust-version = "1.85"

[lib]
name = "kitt_hud_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
kitt-protocol = { git = "https://github.com/rfdetoni/kitt-protocol", rev = "5a8de5984c48eb4012f904815db3feb71100e6af" }
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
